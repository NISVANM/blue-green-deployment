
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-app
      version: green
  template:
    metadata:
      labels:
        app: bluegreen-app
        version: green
    spec:
      containers:
        - name: green-app
          image: bluegreen-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "Green Version 2.0"
            - name: APP_COLOR
              value: "green"
